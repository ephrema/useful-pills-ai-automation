name: Useful Pills AI Daily Production

on:
  schedule:
    # 02:00 UTC = 05:00 Africa/Addis_Ababa
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: useful-pills-daily-production
  cancel-in-progress: false

jobs:
  produce-and-publish:
    # Public repositories get free standard GitHub-hosted runners.
    # Private repositories consume included minutes and may incur charges.
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Africa/Addis_Ababa' }}
      LONG_PUBLISH_HOUR: ${{ vars.LONG_PUBLISH_HOUR || '18' }}
      SHORT_PUBLISH_HOUR: ${{ vars.SHORT_PUBLISH_HOUR || '20' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install piper-tts

      - name: Cache Piper voice model
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-en-us-lessac-medium-v1

      - name: Validate configuration
        run: python pipeline.py validate

      - name: Produce and schedule videos
        run: python pipeline.py run

      - name: Commit publication state
        if: always()
        run: |
          git config user.name "Useful Pills AI Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/*.json
          git diff --cached --quiet || git commit -m "Update automated publishing state [skip ci]"
          git push
